<!doctype html>
<html lang="ur" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>WiFiCall</title><link rel="stylesheet" href="style.css"></head>
<body><main class="app"><header><div class="logo">☎</div><div><h1>WiFiCall</h1><p>انٹرنیٹ آڈیو اور ویڈیو کال</p></div><span id="status" class="status">آف لائن</span></header>
<section id="auth" class="panel"><div class="tabs"><button id="tabRegister" class="active">نیا اکاؤنٹ</button><button id="tabLogin">لاگ اِن</button></div>
<form id="registerForm"><h2>اپنا اکاؤنٹ بنائیں</h2><label>آپ کا نام</label><input id="regName" placeholder="مثلاً احمد" maxlength="24" required><label>پاس ورڈ (کم از کم 6 حروف)</label><input id="regPass" type="password" minlength="6" required><button class="primary">اکاؤنٹ بنائیں</button></form>
<form id="loginForm" hidden><h2>اپنے اکاؤنٹ میں آئیں</h2><label>User ID</label><input id="loginId" placeholder="مثلاً WC123456" required><label>پاس ورڈ</label><input id="loginPass" type="password" required><button class="primary">لاگ اِن</button></form><p id="authMessage" class="message"></p></section>
<section id="home" hidden><div class="panel profile"><div><small>آپ کی User ID</small><strong id="myId">—</strong><span id="myName"></span></div><button id="copyId" class="secondary">ID کاپی کریں</button></div>
<div class="panel"><h2>دوست کو کال کریں</h2><label>دوست کی User ID</label><input id="friendId" placeholder="مثلاً WC123456" autocomplete="off"><div class="callButtons"><button id="audioCall" class="primary">☎ آڈیو کال</button><button id="videoCall" class="video">▣ ویڈیو کال</button></div><p class="hint">دوسرے شخص کا اکاؤنٹ بنا ہونا اور اسی وقت آن لائن ہونا ضروری ہے۔</p></div><button id="logout" class="logout">لاگ آؤٹ</button></section>
<section id="incoming" class="modal" hidden><div class="modalCard"><div class="bigIcon" id="incomingIcon">☎</div><h2 id="incomingTitle">آنے والی کال</h2><p id="incomingFrom"></p><div class="callButtons"><button id="accept" class="primary">کال اٹھائیں</button><button id="reject" class="danger">مسترد کریں</button></div></div></section>
<section id="call" class="modal" hidden><div class="callScreen"><div class="callInfo"><h2 id="callTitle">کال جاری ہے</h2><p id="callSub">کنکشن ہو رہا ہے…</p></div><video id="remoteVideo" autoplay playsinline></video><video id="localVideo" autoplay muted playsinline></video><audio id="remoteAudio" autoplay></audio><div class="callControls"><button id="muteBtn" class="secondary">مائیک بند</button><button id="cameraBtn" class="secondary">کیمرہ بند</button><button id="hangup" class="danger">کال بند کریں</button></div></div></section>
<p id="toast" class="toast" role="status"></p><footer>WiFiCall • انٹرنیٹ کنکشن ضروری ہے</footer></main><script src="/socket.io/socket.io.js"></script><script src="app.js"></script></body></html>
